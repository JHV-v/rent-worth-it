name: Deploy to JD Cloud

# 触发条件：push 到 main 分支
on:
  push:
    branches: [main]
  workflow_dispatch: # 也支持手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出 GitHub 最新代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 镜像推送到 Gitee（用账号 + token 走 https）
        if: env.GITEE_TOKEN != ''
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: |
          git remote add gitee "https://${GITEE_OWNER}:${GITEE_TOKEN}@gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git"
          git push gitee main --force
          git push gitee --tags --force

      - name: SSH 到京东云服务器并执行部署
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.JD_HOST }}
          username: ${{ secrets.JD_USER }}
          key: ${{ secrets.JD_SSH_KEY }}
          port: ${{ secrets.JD_PORT }}
          script: |
            cd /var/www/rent-app
            git fetch --all --tags
            git reset --hard origin/main
            npm install --no-audit --no-fund
            npm run build
            pm2 restart rent-app --update-env
            pm2 status
            echo "✅ 部署完成，当前版本：$(node -p "require('./package.json').version")"
